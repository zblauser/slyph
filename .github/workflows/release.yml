name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig fmt --check src/

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86-linux-musl
          - x86_64-linux-musl
          - aarch64-linux-musl
          - riscv64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-freebsd
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dstrip=true --prefix out

      - name: package
        run: |
          install -d dist
          case "${{ matrix.target }}" in
            *windows*)
              cd out/bin && zip -9 "$GITHUB_WORKSPACE/dist/slyph-${{ github.ref_name }}-${{ matrix.target }}.zip" slyph.exe
              ;;
            *)
              tar -czf dist/slyph-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C out/bin slyph
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: slyph-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
